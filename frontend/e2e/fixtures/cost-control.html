<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="root"></div><script type="module">
import React,{useState} from 'react';import{createRoot}from'react-dom/client';import '../../src/index.css';
import MachineryCostControl from '../../src/components/MachineryCostControl.jsx';import{machineryCostControl}from'../../src/utils/costControl.js';import{supabase}from'../../src/supabaseClient.js';

supabase.from=()=>({upsert:async d=>{window.decisions=[...window.decisions.filter(p=>p.equipo_id!==d.equipo_id||p.fecha!==d.fecha),d];return {error:null};}});

createRoot(document.getElementById('root')).render(React.createElement(App));
</script></body></html>
