<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="fixture"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import '../../src/index.css';
import Obras from '../../src/components/Obras.jsx';
import {supabase} from '../../src/supabaseClient.js';
const readonly=new URLSearchParams(location.search).has('readonly');
let work={id:123,nombre:'Proyecto inicial',empresa:'TEST',tipo:'Cimentaciones',estado:'Activa',cliente:'Mandante prueba'};
const user={id:1,empresa:'TEST',rol:'Administrador',rol_base:'Administrador',obras:'todas',permisos:{'obras.ficha.ver':true,'obras.ficha.editar':!readonly}};
window.saves=[];window.failSave=false;
supabase.from=table=>{
  let single=false;
  const chain=new Proxy({}, {get:(_target,key)=>key==='then'?(resolve=>Promise.resolve({data:table==='obras'?[work]:table==='usuarios'?user:single?null:[],error:null}).then(resolve)):
    (..._args)=>{if(key==='single'||key==='maybeSingle')single=true;return chain;}});
  return chain;
};
supabase.rpc=async(name,args)=>{
  if(name!=='actualizar_ficha_obra')return {data:[],error:null};
  window.saves.push(args);
  if(window.failSave)return {data:null,error:{message:'Ya existe otro proyecto con ese nombre en la empresa'}};
  work={...work,...args.p_datos};return {data:work,error:null};
};
createRoot(document.getElementById('fixture')).render(React.createElement(Obras,{user,initialObraName:work.nombre,onBack:()=>{},onProjectRenamed:event=>{window.renamed=event;}}));
</script></body></html>
